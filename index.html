<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>estrelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --preto: #000;
    --branco: #fff;
    --display: "Syne", "Arial Black", system-ui, sans-serif;
    --corpo: "Instrument Serif", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--preto);
    color: var(--branco);
    font-family: var(--corpo);
    overflow: hidden;
  }

  /* A cena é um grupo isolado: o disco de inversão só afeta o que está lá dentro */
  #cena {
    position: fixed;
    inset: 0;
    background: var(--preto);
    isolation: isolate;
    overflow: hidden;
    cursor: crosshair;
  }

  /* Astrolábio: círculos e meridianos, a única coisa que se move sozinha */
  #astrolabio {
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(130vw, 130vh);
    height: max(130vw, 130vh);
    transform: translate(-50%, -50%);
    animation: rodar 360s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes rodar { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* Palavra gigante, só contorno, cortada pelo canto do ecrã */
 /* #palavra {
    position: absolute;
    left: -1.5vw;
    bottom: -3vw;
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: 25vw;
    line-height: .8;
    letter-spacing: -0.05em;
    color: transparent;
    -webkit-text-stroke: 1px var(--branco);
    pointer-events: none;
    user-select: none;
    z-index: 1;
    white-space: nowrap;
  } */

  #dica {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 22px;
    margin: 0;
    font-style: italic;
    font-size: 1.25rem;
    z-index: 4;
    pointer-events: none;
  }

  #ceu { position: absolute; inset: 0; z-index: 2; }

  .estrela {
    position: absolute;
    width: var(--tam, 28px);
    height: var(--tam, 28px);
    transform: translate(-50%, -50%);
    padding: 0;
    border: 0;
    background: none;
    cursor: crosshair;
    transition: opacity .3s ease;
  }
  .estrela::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--branco);
    clip-path: polygon(
      50% 0%, 52.7% 43.5%, 69.8% 30.2%, 56.5% 47.3%,
      100% 50%, 56.5% 52.7%, 69.8% 69.8%, 52.7% 56.5%,
      50% 100%, 47.3% 56.5%, 30.2% 69.8%, 43.5% 52.7%,
      0% 50%, 43.5% 47.3%, 30.2% 30.2%, 47.3% 43.5%);
    transition: transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .estrela:hover::before,
  .estrela.ativa::before { transform: scale(1.7) rotate(45deg); }
  .estrela:focus-visible { outline: 1px solid var(--branco); outline-offset: 10px; }

  body.sobre .estrela:not(.ativa) { opacity: .25; }

  /* Disco que inverte o céu à volta da estrela.
     Ao clicar, cresce até cobrir o ecrã todo e revela a página da obra. */
  #disco {
    position: absolute;
    left: 0; top: 0;
    width: var(--d, 480px);
    height: var(--d, 480px);
    margin: calc(var(--d, 480px) / -2) 0 0 calc(var(--d, 480px) / -2);
    border-radius: 50%;
    background: var(--branco);
    mix-blend-mode: difference;
    transform: translate(var(--px, 0px), var(--py, 0px)) scale(0);
    transition: transform .55s cubic-bezier(.2, .8, .2, 1);
    pointer-events: none;
    z-index: 3;
  }
  #disco.aberto { transform: translate(var(--px, 0px), var(--py, 0px)) scale(1); }
  #disco.cobre {
    transform: translate(var(--px, 0px), var(--py, 0px)) scale(var(--k, 6));
    transition-duration: .7s;
    transition-timing-function: cubic-bezier(.6, 0, .2, 1);
  }

  #fio {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: difference;
    pointer-events: none;
    z-index: 4;
  }
  #fio line { stroke: var(--branco); stroke-width: 1; }

  /* Cartão: branco puro, cantos vivos, revelado de cima para baixo */
  #cartao {
    position: fixed;
    top: 0; left: 0;
    width: min(300px, calc(100vw - 24px));
    background: var(--branco);
    color: var(--preto);
    pointer-events: none;
    z-index: 10;
    clip-path: inset(0 0 100% 0);
    transition: clip-path .45s cubic-bezier(.2, .8, .2, 1);
  }
  #cartao.visivel { clip-path: inset(0 0 0 0); }

  #cartao .foto {
    position: relative;
    background: var(--preto);
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }
  #cartao .foto[hidden] { display: none; }
  #cartao .foto img,
  #cartao .foto video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.5) brightness(1.05);
  }
  #cartao .foto img[hidden],
  #cartao .foto video[hidden] { display: none; }
  /* Trama de pontos por cima da fotografia */
  #cartao .foto::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #000 0 38%, transparent 42%) 0 0 / 4px 4px;
    mix-blend-mode: multiply;
    opacity: .55;
  }
  #cartao .corpo { padding: 14px 16px 18px; }
  #cartao h2 {
    margin: 0 0 8px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 2rem;
    line-height: .95;
    letter-spacing: -0.04em;
    overflow-wrap: anywhere;
  }
  #cartao p {
    margin: 0;
    font-size: 1.2rem;
    line-height: 1.25;
    font-style: italic;
    white-space: pre-line;
  }
  #cartao .abrir {
    display: block;
    margin-top: 14px;
    font-family: var(--display);
    font-weight: 700;
    font-size: .8rem;
    letter-spacing: -0.01em;
  }
  #cartao .abrir .toque { display: none; }
  @media (hover: none) {
    #cartao .abrir .rato { display: none; }
    #cartao .abrir .toque { display: inline; }
  }

  /* =======================================================
     PÁGINA DA OBRA (o lado "invertido": fundo branco)
     ======================================================= */
  #obra {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: var(--branco);
    color: var(--preto);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0 clamp(16px, 3vw, 40px) 8vh;
  }
  #obra[hidden] { display: none; }

  #voltar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: clamp(16px, 3vw, 40px);
    z-index: 2;
    background: var(--preto);
    color: var(--branco);
    font-family: var(--display);
    font-weight: 700;
    font-size: .95rem;
    letter-spacing: -0.01em;
    text-decoration: none;
    padding: 10px 14px;
    border: 1px solid var(--preto);
  }
  #voltar:hover { background: var(--branco); color: var(--preto); }
  #voltar:focus-visible { outline: 2px solid var(--preto); outline-offset: 3px; }

  #obra h1 {
    margin: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 88px);
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(3.4rem, 15vw, 14rem);
    line-height: .82;
    letter-spacing: -0.055em;
    overflow-wrap: anywhere;
  }

  .textos {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 28px 24px;
    margin: 6vh 0 12vh;
  }
  .textos p { margin: 0; white-space: pre-line; }
  .textos .t1 {
    grid-column: 1 / 9;
    font-size: clamp(1.7rem, 3.4vw, 2.8rem);
    line-height: 1.1;
    font-style: italic;
  }
  .textos .t2 { grid-column: 2 / 7; }
  .textos .t3 { grid-column: 8 / 13; }
  .textos .t2, .textos .t3 { font-size: 1.35rem; line-height: 1.3; }

  .galeria {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 10vh 24px;
  }
  .galeria figure { margin: 0; grid-column: var(--c, 1 / -1); }
  .galeria .m { position: relative; background: var(--preto); }
  .galeria .m img,
  .galeria .m video { display: block; width: 100%; height: auto; }
  .galeria .m iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; }
  .galeria .m.vertical { max-width: min(100%, 380px); }
  .galeria .m.vertical iframe { aspect-ratio: 9 / 16; }
  .galeria figcaption {
    margin-top: 10px;
    font-style: italic;
    font-size: 1.05rem;
  }

  /* Em ecrãs com rato, as imagens ficam a preto e branco e ganham cor ao passar */
  @media (hover: hover) {
    .galeria .m { filter: grayscale(1) contrast(1.15); transition: filter .5s ease; }
    .galeria figure:hover .m { filter: none; }
  }

  .fim {
    display: block;
    margin-top: 16vh;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.4rem, 9vw, 8rem);
    line-height: .9;
    letter-spacing: -0.05em;
    color: var(--preto);
    text-decoration: none;
  }
  .fim:hover { color: transparent; -webkit-text-stroke: 1px var(--preto); }

  @media (max-width: 760px) {
    .textos .t1, .textos .t2, .textos .t3 { grid-column: 1 / -1; }
    .galeria figure { grid-column: 1 / -1; }
  }

  /* Grão de película por cima de tudo */
  #grao {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    opacity: .14;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #estado {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-style: italic;
    font-size: 1.3rem;
    max-width: 30ch;
    z-index: 4;
  }
  #estado[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #astrolabio { animation: none; }
    .estrela::before, #disco, #cartao { transition: none; }
  }
</style>
</head>
<body>

<div id="cena">
  <svg id="astrolabio" viewBox="0 0 1000 1000" aria-hidden="true" fill="none" stroke="#fff" stroke-width="1">
    <g opacity=".22">
      <circle cx="500" cy="500" r="120"/>
      <circle cx="500" cy="500" r="240"/>
      <circle cx="500" cy="500" r="360"/>
      <circle cx="500" cy="500" r="480"/>
    </g>
    <g opacity=".3">
      <circle cx="500" cy="500" r="300" stroke-dasharray="1 9"/>
      <circle cx="500" cy="500" r="420" stroke-dasharray="1 9"/>
    </g>
    <g opacity=".18">
      <line x1="500" y1="0" x2="500" y2="1000"/>
      <line x1="0" y1="500" x2="1000" y2="500"/>
      <line x1="146" y1="146" x2="854" y2="854"/>
      <line x1="854" y1="146" x2="146" y2="854"/>
      <line x1="500" y1="0" x2="780" y2="1000"/>
      <line x1="500" y1="0" x2="220" y2="1000"/>
      <line x1="500" y1="1000" x2="780" y2="0"/>
      <line x1="500" y1="1000" x2="220" y2="0"/>
    </g>
  </svg>


  <p id="dica">try and touch some stars</p>

  <main id="ceu" aria-label="Céu com estrelas"></main>

  <svg id="fio" aria-hidden="true"><line id="fio-linha" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/></svg>

</div>

<article id="cartao" aria-hidden="true">
  <div class="foto" hidden>
    <img alt="" hidden>
    <video muted loop playsinline hidden></video>
  </div>
  <div class="corpo">
    <h2></h2>
    <p></p>
    <span class="abrir"><span class="rato">clica para abrir →</span><span class="toque">toca outra vez para abrir →</span></span>
  </div>
</article>

<section id="obra" aria-label="Obra" hidden>
  <a id="voltar" href="#/" data-voltar>← voltar</a>
  <div id="obra-conteudo"></div>
</section>

<div id="grao"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   1. CONFIGURAÇÃO DO SUPABASE
   Tabela "estrelas" com as colunas:
     id, titulo, descricao, descricao_2, descricao_3,
     imagem_url, media_1 … media_5   (imagens, vídeos .mp4/.webm ou links do YouTube)
     x, y (0–100, opcional), tamanho (px, opcional)
   ========================================================= */
const SUPABASE_URL = "https://xvpgktwxrbutclvtkqmo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cGdrdHd4cmJ1dGNsdnRrcW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDU5NTksImV4cCI6MjEwNzQ4MTk1OX0.srXAspWzaD59F20-mXiNHOBiidDo7OHYb0Vfz5Rbw60";
const TABELA = "estrelas";
const TITULO_SITE = "estrelas";

/* Dados de exemplo, usados enquanto o Supabase não estiver configurado. */
function imagemExemplo(n) {
  let aneis = "";
  for (let i = 1; i <= 7; i++) {
    aneis += `<circle cx="${60 + n * 35}" cy="${70 + n * 12}" r="${i * 22 + n * 4}" fill="none" stroke="#fff" stroke-width="${i % 2 ? 2 : 6}" opacity="${0.9 - i * 0.1}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><defs><radialGradient id="g" cx="${25 + n * 8}%" cy="35%" r="90%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#222"/></radialGradient></defs><rect width="320" height="240" fill="url(#g)"/>${aneis}</svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
const EXEMPLO = [
  { id: 1, titulo: "sirius", descricao: "A mais brilhante do céu noturno, a cerca de 8,6 anos-luz.", descricao_2: "Segunda descrição de exemplo.", media_1: imagemExemplo(2), imagem_url: imagemExemplo(1) },
  { id: 2, titulo: "vega", descricao: "Já foi a estrela polar e voltará a sê-lo daqui a milhares de anos.", imagem_url: imagemExemplo(2) },
  { id: 3, titulo: "betelgeuse", descricao: "Uma supergigante vermelha no ombro de Orionte.", imagem_url: imagemExemplo(3) }
];

/* =========================================================
   2. CARREGAR AS ESTRELAS
   ========================================================= */
const configurado = !SUPABASE_URL.includes("O-TEU-PROJETO");
const ceu = document.getElementById("ceu");
const cena = document.getElementById("cena");
const estado = document.getElementById("estado");
let ESTRELAS = [];
let carregado = false;

async function carregarEstrelas() {
  if (!configurado) {
    estado.hidden = true;
    return EXEMPLO;
  }
  try {
    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await cliente.from(TABELA).select("*");
    if (error) throw error;
    if (!data || !data.length) {
      estado.textContent = "ainda não há estrelas. adiciona linhas à tabela no Supabase.";
      return [];
    }
    estado.hidden = true;
    return data;
  } catch (err) {
    console.error("Erro ao ler o Supabase:", err);
    estado.textContent = "não foi possível carregar as estrelas. verifica o URL, a chave e as permissões (RLS) da tabela.";
    return [];
  }
}

/* =========================================================
   3. MEDIA: imagens, vídeos e YouTube
   ========================================================= */
function listaMedia(d) {
  return [d.imagem_url, d.media_1, d.media_2, d.media_3, d.media_4, d.media_5]
    .map(v => (v == null ? "" : String(v).trim()))
    .filter(Boolean);
}

function urlSegura(url) {
  return /^https?:\/\//i.test(url) || /^data:image\//i.test(url);
}

/* Reconhece youtube.com/watch, youtu.be, /shorts, /embed, /live */
function youtube(url) {
  let u;
  try { u = new URL(url); } catch { return null; }
  const host = u.hostname.replace(/^(www\.|m\.|music\.)/, "");
  let id = null, shorts = false;
  if (host === "youtu.be") {
    id = u.pathname.slice(1).split("/")[0];
  } else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    if (u.pathname === "/watch") id = u.searchParams.get("v");
    else {
      const p = u.pathname.split("/").filter(Boolean);
      if (["shorts", "embed", "live", "v"].includes(p[0])) { id = p[1]; shorts = p[0] === "shorts"; }
    }
  } else return null;
  if (!id || !/^[\w-]{11}$/.test(id)) return null;

  /* instante de início: ?t=90 ou ?t=1m30s */
  const t = u.searchParams.get("t") || u.searchParams.get("start") || "";
  let start = 0;
  if (/^\d+$/.test(t)) start = +t;
  else {
    const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
    if (m) start = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
  }
  return { id, shorts, start };
}

function ehVideoFicheiro(url) {
  try { return /\.(mp4|webm|mov|m4v|ogv)$/i.test(new URL(url).pathname); }
  catch { return false; }
}

/* Primeira media serve de capa no cartão */
function capa(d) {
  const m = listaMedia(d)[0];
  if (!m) return null;
  const yt = youtube(m);
  if (yt) return { tipo: "img", src: `https://i.ytimg.com/vi/${yt.id}/hqdefault.jpg` };
  if (!urlSegura(m)) return null;
  return { tipo: ehVideoFicheiro(m) ? "video" : "img", src: m };
}

/* =========================================================
   4. DESENHAR AS ESTRELAS
   Se a linha não tiver x/y, a posição é distribuída automaticamente.
   ========================================================= */
const frac = n => n - Math.floor(n);
const reduzirMovimento = matchMedia("(prefers-reduced-motion: reduce)").matches;

function posicao(estrela, i) {
  const x = estrela.x ?? (6 + frac(0.5 + (i + 1) * 0.7548776662) * 88);
  const y = estrela.y ?? (14 + frac(0.5 + (i + 1) * 0.5698402909) * 70);
  return { x, y };
}

function desenhar(estrelas) {
  ceu.replaceChildren();
  estrelas.forEach((e, i) => {
    const { x, y } = posicao(e, i);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "estrela";
    b.style.left = x + "%";
    b.style.top = y + "%";
    b.style.setProperty("--tam", (e.tamanho ?? 20 + frac(i * 0.37) * 26) + "px");
    b.setAttribute("aria-label", e.titulo || "Estrela");
    b._dados = e;

    b.addEventListener("pointerenter", ev => { if (ev.pointerType === "mouse") mostrar(b); });
    b.addEventListener("pointerleave", ev => { if (ev.pointerType === "mouse") esconder(b); });
    b.addEventListener("focus", () => { if (b.matches(":focus-visible")) mostrar(b); });
    b.addEventListener("blur", () => esconder(b));
    b.addEventListener("click", ev => {
      ev.stopPropagation();
      const toque = ev.pointerType === "touch" || ev.pointerType === "pen";
      /* toque: 1.º toque mostra o cartão, 2.º abre a obra. Rato/teclado: abre logo. */
      if (toque && !b.classList.contains("ativa")) mostrar(b);
      else entrar(b);
    });
    ceu.appendChild(b);
  });
}

/* =========================================================
   5. DISCO DE INVERSÃO + CARTÃO DE PRÉ-VISUALIZAÇÃO
   ========================================================= */
const cartao = document.getElementById("cartao");
const foto = cartao.querySelector(".foto");
const cImg = cartao.querySelector("img");
const cVid = cartao.querySelector("video");
const cTitulo = cartao.querySelector("h2");
const cDesc = cartao.querySelector("p");
const disco = document.getElementById("disco");
const fio = document.getElementById("fio-linha");
let atual = null;
let ultimaEstrela = null;

function mostrar(botao) {
  if (atual && atual !== botao) atual.classList.remove("ativa");
  atual = botao;
  botao.classList.add("ativa");
  document.body.classList.add("sobre");
  const d = botao._dados;

  cTitulo.textContent = d.titulo || "";
  cDesc.textContent = d.descricao || "";

  const c = capa(d);
  cImg.hidden = true;
  cVid.hidden = true;
  cVid.pause();
  if (c) {
    foto.hidden = false;
    if (c.tipo === "video") {
      cVid.src = c.src;
      cVid.hidden = false;
      cVid.play().catch(() => {});
    } else {
      cImg.src = c.src;
      cImg.alt = d.titulo || "";
      cImg.hidden = false;
    }
  } else {
    foto.hidden = true;
  }

  cartao.setAttribute("aria-hidden", "false");
  cartao.classList.add("visivel");
  disco.classList.remove("cobre");
  disco.classList.add("aberto");
  posicionar(botao);
}

function esconder(botao) {
  if (atual !== botao) return;
  botao.classList.remove("ativa");
  atual = null;
  document.body.classList.remove("sobre");
  cartao.classList.remove("visivel");
  cartao.setAttribute("aria-hidden", "true");
  disco.classList.remove("aberto");
  fio.setAttribute("visibility", "hidden");
  cVid.pause();
}

function posicionar(botao) {
  const margem = 12;
  const r = botao.getBoundingClientRect();
  const sx = r.left + r.width / 2;
  const sy = r.top + r.height / 2;

  /* disco centrado na estrela */
  const diametro = Math.min(520, window.innerWidth * 0.9);
  disco.style.setProperty("--d", diametro + "px");
  disco.style.setProperty("--px", sx + "px");
  disco.style.setProperty("--py", sy + "px");

  /* cartão por cima da estrela; se não couber, por baixo */
  const w = cartao.offsetWidth;
  const h = cartao.offsetHeight;
  let left = Math.max(margem, Math.min(sx - w / 2, window.innerWidth - w - margem));
  let top = sy - h - 34;
  if (top < margem) top = sy + 34;
  top = Math.max(margem, Math.min(top, window.innerHeight - h - margem));
  cartao.style.left = left + "px";
  cartao.style.top = top + "px";

  /* fio da estrela ao ponto mais próximo do cartão */
  const px = Math.max(left, Math.min(sx, left + w));
  const py = sy < top ? top : (sy > top + h ? top + h : sy);
  fio.setAttribute("x1", sx);
  fio.setAttribute("y1", sy);
  fio.setAttribute("x2", px);
  fio.setAttribute("y2", py);
  fio.setAttribute("visibility", (sy < top || sy > top + h) ? "visible" : "hidden");
}

/* =========================================================
   6. ENTRAR NA OBRA: o disco cresce até cobrir o ecrã
   ========================================================= */
let veioDoCeu = false;

function entrar(botao) {
  const d = botao._dados;
  ultimaEstrela = botao;

  const r = botao.getBoundingClientRect();
  const sx = r.left + r.width / 2;
  const sy = r.top + r.height / 2;
  const W = window.innerWidth, H = window.innerHeight;
  const D = Math.min(520, W * 0.9);
  const raio = Math.hypot(Math.max(sx, W - sx), Math.max(sy, H - sy));
  disco.style.setProperty("--d", D + "px");
  disco.style.setProperty("--px", sx + "px");
  disco.style.setProperty("--py", sy + "px");
  disco.style.setProperty("--k", (2 * raio + 80) / D);

  /* limpar o estado de pré-visualização */
  botao.classList.remove("ativa");
  atual = null;
  document.body.classList.remove("sobre");
  cartao.classList.remove("visivel");
  cartao.setAttribute("aria-hidden", "true");
  fio.setAttribute("visibility", "hidden");
  cVid.pause();
  cena.inert = true;

  disco.classList.add("aberto", "cobre");
  veioDoCeu = true;
  setTimeout(() => {
    location.hash = "#/obra/" + encodeURIComponent(String(d.id));
  }, reduzirMovimento ? 0 : 640);
}

/* =========================================================
   7. PÁGINA DA OBRA
   ========================================================= */
const obra = document.getElementById("obra");
const obraConteudo = document.getElementById("obra-conteudo");
const linkVoltar = document.getElementById("voltar");

/* posições das imagens na grelha de 12 colunas (efeito assimétrico) */
const PADROES = ["1 / 9", "5 / 13", "2 / 10", "1 / 7", "6 / 13", "3 / 12"];

function el(tag, cls, texto) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (texto != null) n.textContent = texto;
  return n;
}

function criarFigura(url, i, total, titulo) {
  const fig = el("figure");
  fig.style.setProperty("--c", PADROES[i % PADROES.length]);
  const m = el("div", "m");
  const yt = youtube(url);

  if (yt) {
    if (yt.shorts) m.classList.add("vertical");
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${yt.id}?rel=0&playsinline=1` + (yt.start ? `&start=${yt.start}` : "");
    f.title = `${titulo || "obra"} — vídeo ${i + 1}`;
    f.loading = "lazy";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
    m.append(f);
  } else if (!urlSegura(url)) {
    return null;
  } else if (ehVideoFicheiro(url)) {
    const v = document.createElement("video");
    v.src = url;
    v.controls = true;
    v.playsInline = true;
    v.preload = "metadata";
    m.append(v);
  } else {
    const img = document.createElement("img");
    img.src = url;
    img.alt = `${titulo || "obra"} — ${i + 1}`;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => { fig.hidden = true; };
    m.append(img);
  }

  fig.append(m, el("figcaption", "", `${i + 1} / ${total}`));
  return fig;
}

function mostrarObra(id) {
  const e = ESTRELAS.find(x => String(x.id) === id);
  obraConteudo.replaceChildren();

  if (!e) {
    obraConteudo.append(el("h1", "", "obra não encontrada"));
  } else {
    obraConteudo.append(el("h1", "", e.titulo || ""));

    const textos = el("div", "textos");
    [e.descricao, e.descricao_2, e.descricao_3].forEach((t, i) => {
      if (t && String(t).trim()) textos.append(el("p", "t" + (i + 1), String(t).trim()));
    });
    if (textos.children.length) obraConteudo.append(textos);

    const midias = listaMedia(e);
    if (midias.length) {
      const g = el("div", "galeria");
      midias.forEach((u, i) => {
        const f = criarFigura(u, i, midias.length, e.titulo);
        if (f) g.append(f);
      });
      obraConteudo.append(g);
    }
  }

  const fim = el("a", "fim", "← voltar ao céu");
  fim.href = "#/";
  fim.setAttribute("data-voltar", "");
  fim.addEventListener("click", aoVoltar);
  obraConteudo.append(fim);

  cena.inert = true;
  obra.hidden = false;
  obra.scrollTop = 0;
  document.title = (e && e.titulo ? e.titulo + " — " : "") + TITULO_SITE;
  linkVoltar.focus({ preventScroll: true });
}

function fecharObra() {
  const estavaAberta = !obra.hidden;
  obra.hidden = true;
  obraConteudo.replaceChildren();   /* pára vídeos e iframes */
  cena.inert = false;
  document.title = TITULO_SITE;
  veioDoCeu = false;
  /* o disco encolhe de volta para a estrela */
  disco.classList.remove("cobre", "aberto");
  if (estavaAberta && ultimaEstrela && ultimaEstrela.isConnected) {
    ultimaEstrela.focus({ preventScroll: true });
    ultimaEstrela.blur();
  }
}

function voltar() {
  if (veioDoCeu) history.back();
  else location.hash = "#/";
}
function aoVoltar(ev) {
  ev.preventDefault();
  voltar();
}
linkVoltar.addEventListener("click", aoVoltar);

/* Rotas por hash: "#/" é o céu, "#/obra/ID" é a página da obra.
   Funciona em GitHub Pages porque não precisa de servidor. */
function rota() {
  const m = location.hash.match(/^#\/obra\/(.+)$/);
  if (m) {
    if (!carregado) return;
    mostrarObra(decodeURIComponent(m[1]));
  } else {
    fecharObra();
  }
}
window.addEventListener("hashchange", rota);

/* =========================================================
   8. EVENTOS GERAIS E ARRANQUE
   ========================================================= */
document.addEventListener("click", () => atual && esconder(atual));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!obra.hidden) voltar();
  else if (atual) esconder(atual);
});
window.addEventListener("resize", () => atual && posicionar(atual));

carregarEstrelas().then(lista => {
  ESTRELAS = lista;
  desenhar(lista);
  carregado = true;
  rota();
});
</script>
